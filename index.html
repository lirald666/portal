    function applyTheme(themeName) {
      document.body.className = '';
      if (themeName) document.body.classList.add('theme-' + themeName);
    }
    function updateHeader(platformKey) {
      const p = knowledgeBase[platformKey];
      if (p) {
        document.getElementById('headerTitle').textContent = p.name + ' • Suporte';
        document.getElementById('headerStatus').textContent = 'Online • ' + p.name;
      }
    }

    function normalize(str) {
      return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    }
    function getTime() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }
    function scrollToBottom() {
      requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
    }
    function formatText(text) {
      return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    }

    function createMessage(text, isBot = true, extraHTML = '') {
      const div = document.createElement('div');
      div.className = `message ${isBot ? 'bot' : 'user'}`;
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = isBot ? '🤖' : '👤';
      const content = document.createElement('div');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = formatText(text) + extraHTML;
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = getTime();
      content.appendChild(bubble);
      content.appendChild(time);
      div.appendChild(avatar);
      div.appendChild(content);
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function showTyping() {
      if (isTyping) return;
      isTyping = true;
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typingIndicator';
      div.innerHTML = `<div class="avatar">🤖</div><div class="typing"><span></span><span></span><span></span></div>`;
      messagesEl.appendChild(div);
      scrollToBottom();
    }
    function hideTyping() {
      isTyping = false;
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }
    function botReply(text, delay = 700, extraHTML = '') {
      showTyping();
      return new Promise(resolve => {
        setTimeout(() => {
          hideTyping();
          createMessage(text, true, extraHTML);
          resolve();
        }, delay);
      });
    }
    function showTransferring(platformName) {
      return new Promise(resolve => {
        const div = document.createElement('div');
        div.className = 'transfer-msg';
        div.id = 'transferMsg';
        div.innerHTML = `🔄 Transferindo para o suporte do <strong>${platformName}</strong><span class="dots"><span>.</span><span>.</span><span>.</span></span>`;
        messagesEl.appendChild(div);
        scrollToBottom();
        setTimeout(() => {
          const el = document.getElementById('transferMsg');
          if (el) el.remove();
          resolve();
        }, 1800);
      });
    }

    function formatMMSS(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

      return `

    function pushAds() {
      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});

    }

    function startAttendantQueue() {
      const minSec = 10 * 60;
      const maxSec = 30 * 60;
      queueSecondsLeft = Math.floor(Math.random() * (maxSec - minSec + 1)) + minSec;
      const p = knowledgeBase[currentPlatform];
      const link = (p && p.suporteLink) ? p.suporteLink : 'https://www.jadeucerto.net';

      const queueHTML = `
        <div class="queue-box" id="queueBox">
          <h4>⏳ Você está na fila de atendimento</h4>
          <div class="queue-warning">⚠️ <strong>Não saia deste chat</strong> enquanto aguarda. Se sair, sua posição na fila pode ser perdida.</div>
          <div class="queue-timer" id="queueTimer">${formatMMSS(queueSecondsLeft)}</div>
          <div class="queue-info">Tempo estimado de espera. Assim que chegar a sua vez, um botão aparecerá aqui.</div>
          ${getAdSenseHTML()}
          <div id="queueArrivedSlot"></div>
        </div>`;

      createMessage(`Você foi colocado na **fila de atendimento humano**.\n\nPor favor, **não saia deste chat** enquanto aguarda.`, true, queueHTML);
      setTimeout(pushAds, 500);

      if (queueTimerInterval) clearInterval(queueTimerInterval);
      queueTimerInterval = setInterval(() => {
        queueSecondsLeft--;
        const timerEl = document.getElementById('queueTimer');
        if (timerEl) timerEl.textContent = formatMMSS(Math.max(0, queueSecondsLeft));
        if (queueSecondsLeft <= 0) {
          clearInterval(queueTimerInterval);
          queueTimerInterval = null;
          const slot = document.getElementById('queueArrivedSlot');
          if (slot) {
            slot.innerHTML = `<div style="margin-top:14px"><p style="margin-bottom:10px;font-size:13px;color:var(--accent)">✅ Sua vez chegou!</p><a href="${link}" target="_blank" rel="noopener" class="quick-btn arrived" style="display:inline-block;text-decoration:none">🙋 Cheguei, clique aqui</a></div>`;
          }
          scrollToBottom();
        }
      }, 1000);
    }

    function detectPlatform(text) {
      const n = normalize(text);
      let best = null, bestScore = 0;
      for (const [key, data] of Object.entries(knowledgeBase)) {
        for (const alias of data.aliases) {
          const a = normalize(alias);
          if (n === a) return key;
          if (n.includes(a)) {
            const score = a.length;
            if (score > bestScore) { bestScore = score; best = key; }
          }
        }
      }
      return best;
    }

    function detectIntent(text) {
      const n = normalize(text);
      if (/saque.*recus|recus.*saque|saque.*negad|negad.*saque|saque.*rejeit|rejeit.*saque|nao.*consegui.*sacar|saque.*nao.*foi|problema.*saque/.test(n)) return 'saque_recusado';
      if (/bingo|cartela/.test(n)) return 'bingo';
      if (/pule|resultado.*nao.*(saiu|ocorreu|teve)|sorteio.*nao.*(saiu|ocorreu)|nao.*teve.*resultado|pule.*valida|pule.*vale/.test(n)) return 'pule';
      if (/cassino|casino|slot|tigrinho|fortune tiger|jogo.*nao.*(abre|roda)|premio.*cassino|premio.*nao.*pago|saldo.*cassino|recarga.*cassino/.test(n)) return 'cassino';
      if (/excluir.*conta|deletar.*conta|apagar.*conta|remover.*conta|fechar.*conta|cancelar.*conta/.test(n)) return 'excluir';
      if (/bonus|promo|promocao|oferta|recarga.*bonus/.test(n)) return 'bonus';
      if (/cotacao|milhar|centena|dezena|grupo|paga quanto|quanto paga|premio/.test(n)) return 'cotacao';
      if (/deposito|depositar|recarregar|pix|colocar dinheiro|carregar/.test(n)) return 'deposito';
      if (/saque|sacar|retirar|receber|pagamento|transferir/.test(n)) return 'saque';
      if (/tutorial|como jogar|como funciona.*jogo|aprender|ensina|como apostar|como fazer aposta/.test(n)) return 'tutorial';
      if (/jogo|jogar|loteria/.test(n)) return 'jogos';
      if (/suporte|atendimento|contato|falar|humano|ajuda|atendente/.test(n)) return 'suporte';
      if (/problema|erro|bug|nao abre|travando|lento|nao caiu|nao credit|nao funciona|travou|nao consigo/.test(n)) return 'problemas';
      if (/geral|sobre|o que e|como funciona|informacao|link oficial|site oficial/.test(n)) return 'geral';
      return 'geral';
    }

    function isConfirmation(text) {
      const n = normalize(text);
      const yes = ['sim', 'isso', 'correto', 'certo', 'exato', 'confirmo', 'pode ser', 'ok', 'okay', 'yes', 'uhum', 'isso mesmo', 'e esse', 'esse', 'positivo'];
      return yes.some(w => n === w || n.startsWith(w + ' ') || n.includes(' ' + w));
    }
    function isDenial(text) {
      const n = normalize(text);
      const no = ['nao', 'errado', 'incorreto', 'outro', 'outra', 'negativo', 'no'];
      return no.some(w => n === w || n.startsWith(w + ' ') || n.includes(' ' + w));
    }

    async function processMessage(userText) {
      const text = userText.trim();
      if (!text) return;
      createMessage(text, false);
      inputEl.value = '';
      autoResize();

      if (state === 'asking_platform') {
        const detected = detectPlatform(text);
        if (detected) {
          pendingPlatform = detected;
          state = 'confirming';
          const p = knowledgeBase[detected];
          await botReply(`Entendi! Você está pedindo suporte para o **${p.name}** ${p.icon}.\n\nEstá correto?`, 800,
            `<div class="quick-replies"><button class="quick-btn confirm" onclick="confirmPlatform(true)">✅ Sim, está correto</button><button class="quick-btn deny" onclick="confirmPlatform(false)">❌ Não, é outro</button></div>`);
        } else {
          await botReply(`Não consegui identificar o aplicativo com clareza.\n\nPode digitar novamente o nome? Exemplos: Acertos Club, Feiticeira, Tiger Club, SuperBancas, Banca Brasileira ou Super Acertos.`, 900);
        }
        return;
      }

      if (state === 'confirming') {
        if (isConfirmation(text)) await confirmPlatform(true);
        else if (isDenial(text)) await confirmPlatform(false);
        else {
          const newDetected = detectPlatform(text);
          if (newDetected) {
            pendingPlatform = newDetected;
            const p = knowledgeBase[newDetected];
            await botReply(`Ok, então você quis dizer **${p.name}** ${p.icon}?\n\nConfirma?`, 700,
              `<div class="quick-replies"><button class="quick-btn confirm" onclick="confirmPlatform(true)">✅ Sim</button><button class="quick-btn deny" onclick="confirmPlatform(false)">❌ Não</button></div>`);
          } else {
            await botReply(`Por favor, confirme se é o **${knowledgeBase[pendingPlatform].name}** respondendo **sim** ou **não**.`, 600);
          }
        }
        return;
      }

      if (state === 'awaiting_question' || state === 'answering') {
        if (/trocar|outra plataforma|outro app|mudar|quero outro|outro aplicativo/.test(normalize(text))) {
          state = 'asking_platform';
          currentPlatform = null; pendingPlatform = null;
          applyTheme(null);
          document.getElementById('headerTitle').textContent = 'Suporte Inteligente';
          document.getElementById('headerStatus').textContent = 'Online • Atendimento inteligente';
          if (queueTimerInterval) { clearInterval(queueTimerInterval); queueTimerInterval = null; }
          await botReply(`Sem problema! Qual aplicativo você deseja suporte agora?`, 600);
          return;
        }

        const intent = detectIntent(text);
        const platform = knowledgeBase[currentPlatform];

        if (intent === 'saque_recusado') {
          state = 'answering';
          await botReply(SAQUE_RECUSADO, 900, `
            <div class="quick-replies">
              <button class="quick-btn attendant" onclick="callAttendant()">🙋 Chamar Atendente</button>
              <button class="quick-btn" onclick="quickAsk('saque')">📤 Mais sobre saque</button>
              <button class="quick-btn" onclick="quickAsk('problemas')">🛠️ Outros problemas</button>
            </div>`);
          return;
        }

        if (intent === 'bingo') {
          state = 'answering';
          await botReply(platform.info.bingo || BINGO_INFO, 900, `
            <div class="quick-replies">
              <button class="quick-btn attendant" onclick="callAttendant()">🙋 Chamar Atendente</button>
              <button class="quick-btn" onclick="quickAsk('tutorial')">📖 Como jogar loterias</button>
              <button class="quick-btn" onclick="quickAsk('pule')">📌 Validade da pule</button>
            </div>`);
          return;
        }

        if (intent === 'pule') {
          state = 'answering';
          await botReply(platform.info.pule || PULE_VALIDADE, 900);
          await showMoreHelp(platform);
          return;
        }

        if (intent === 'cassino') {
          state = 'answering';
          let msg = platform.info.cassino || CASSINO_INFO;
          if (platform.officialLink) msg += `\n\n**Link oficial recomendado:** ${platform.officialLink}`;
          await botReply(msg, 900, `
            <div class="quick-replies">
              ${platform.officialLink ? `<a class="quick-btn" href="${platform.officialLink}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">🔗 Abrir link oficial</a>` : ''}
              <button class="quick-btn attendant" onclick="callAttendant()">🙋 Chamar Atendente</button>
              <button class="quick-btn" onclick="quickAsk('tutorial')">📖 Como jogar loterias</button>
            </div>`);
          return;
        }

        if (intent === 'excluir') {
          state = 'answering';
          await botReply(platform.info.excluir || EXCLUIR_CONTA, 900);
          await showMoreHelp(platform);
          return;
        }

        if (intent === 'tutorial') {
          state = 'answering';
          await botReply(platform.info.tutorial || TUTORIAL_LOTERIAS, 900);
          await showMoreHelp(platform);
          return;
        }

        if (intent === 'suporte' && /atendente|humano|pessoa|falar com/.test(normalize(text))) {
          await callAttendant();
          return;
        }

        const answer = platform.info[intent] || platform.info.geral;
        state = 'answering';
        await botReply(answer, 900);
        await showMoreHelp(platform);
      }
    }

    async function showMoreHelp(platform) {
      await botReply(`Posso ajudar com mais alguma dúvida sobre o **${platform.name}**?`, 400, `
        <div class="quick-replies">
          <button class="quick-btn" onclick="quickAsk('bonus')">🎁 Bônus</button>
          <button class="quick-btn" onclick="quickAsk('cotacao')">💰 Cotação</button>
          <button class="quick-btn" onclick="quickAsk('deposito')">📥 Depósito</button>
          <button class="quick-btn" onclick="quickAsk('saque')">📤 Saque</button>
          <button class="quick-btn" onclick="quickAsk('tutorial')">📖 Como jogar</button>
          <button class="quick-btn" onclick="quickAsk('bingo')">🎱 Bingo</button>
          <button class="quick-btn" onclick="quickAsk('pule')">📌 Pule / resultado</button>
          <button class="quick-btn" onclick="quickAsk('cassino')">🎰 Cassino</button>
          <button class="quick-btn" onclick="quickAsk('excluir')">🗑️ Excluir conta</button>
          <button class="quick-btn" onclick="quickAsk('problemas')">🛠️ Problemas</button>
          <button class="quick-btn attendant" onclick="callAttendant()">🙋 Atendente</button>
          <button class="quick-btn" onclick="changePlatform()">🔄 Trocar app</button>
        </div>`);
    }

    window.confirmPlatform = async function(yes) {
      if (yes) {
        currentPlatform = pendingPlatform;
        pendingPlatform = null;
        const p = knowledgeBase[currentPlatform];
        createMessage('Sim, está correto', false);
        await showTransferring(p.name);
        applyTheme(p.theme);
        updateHeader(currentPlatform);
        state = 'awaiting_question';
        await botReply(`Você foi transferido para o suporte do **${p.name}** ${p.icon}.\n\nEste atendimento prioriza **Loterias e Bingo**. Para cassino o suporte é limitado.\n\nQual é a sua dúvida?`, 600);
      } else {
        createMessage('Não, é outro', false);
        state = 'asking_platform';
        pendingPlatform = null;
        currentPlatform = null;
        applyTheme(null);
        await botReply(`Entendi, desculpe o equívoco.\n\nPode me dizer novamente o nome do aplicativo que você precisa de suporte?`, 700);
      }
    };

    window.callAttendant = async function() {
      createMessage('Quero falar com um atendente', false);
      state = 'answering';
      await botReply(`Certo. Vou te colocar na **fila de atendimento humano**.\n\nPor favor, **não saia deste chat** enquanto aguarda.`, 700);
      startAttendantQueue();
    };

    window.quickAsk = async function(intent) {
      const labels = {
        bonus: 'Quero saber sobre os bônus',
        cotacao: 'Qual é a cotação?',
        deposito: 'Como faço um depósito?',
        saque: 'Como faço um saque?',
        tutorial: 'Como jogar nas loterias?',
        problemas: 'Estou com um problema',
        saque_recusado: 'Meu saque foi recusado',
        cassino: 'Tenho dúvida sobre o cassino',
        excluir: 'Quero excluir minha conta',
        bingo: 'Quero saber sobre o bingo',
        pule: 'O resultado não saiu, a pule vale?'
      };
      await processMessage(labels[intent] || intent);
    };

    window.changePlatform = async function() {
      createMessage('Quero trocar de aplicativo', false);
      state = 'asking_platform';
      currentPlatform = null;
      pendingPlatform = null;
      applyTheme(null);
      document.getElementById('headerTitle').textContent = 'Suporte Inteligente';
      document.getElementById('headerStatus').textContent = 'Online • Atendimento inteligente';
      if (queueTimerInterval) { clearInterval(queueTimerInterval); queueTimerInterval = null; }
      await botReply(`Combinado! Qual aplicativo você deseja suporte agora?`, 600);
    };

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }
    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    }
    inputEl.addEventListener('input', autoResize);

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isTyping) return;
      sendBtn.disabled = true;
      await processMessage(text);
      sendBtn.disabled = false;
      inputEl.focus();
    }

    async function startChat() {
      state = 'asking_platform';
      currentPlatform = null;
      pendingPlatform = null;
      applyTheme(null);
      document.getElementById('headerTitle').textContent = 'Suporte Inteligente';
      document.getElementById('headerStatus').textContent = 'Online • Atendimento inteligente';
      if (queueTimerInterval) { clearInterval(queueTimerInterval); queueTimerInterval = null; }
      await botReply(`Olá! 👋 Sou o **Assistente de Suporte Inteligente**.\n\nPara te atender da melhor forma, preciso saber:\n\n**Qual aplicativo ou banca você deseja suporte?**`, 900);
    }

    function resetChat() {
      if (queueTimerInterval) { clearInterval(queueTimerInterval); queueTimerInterval = null; }
      messagesEl.innerHTML = '';
      startChat();
    }

    setTimeout(() => inputEl.focus(), 300);
    startChat();
  </script>
