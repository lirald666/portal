<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Já Deu Certo | Notícias da Paraíba e do mundo</title>
  <meta name="description" content="Portal Já Deu Certo: manchetes da Paraíba, do Brasil e do mundo, com crédito à fonte." />
  <meta name="google-adsense-account" content="ca-pub-5066020163837493" />
  <meta name="theme-color" content="#0e3b2e" />
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1V0JM8J72L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-1V0JM8J72L");
  </script>
  <style>
    :root { --ink:#14211c; --paper:#f4efe4; --card:#fffdf8; --forest:#0e3b2e; --moss:#1d6b4a; --gold:#a9782f; --line:#e4dccb; --muted:#5d675f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Source Sans 3", sans-serif; background:var(--paper); color:var(--ink); }
    a { color: inherit; }
    header { position:sticky; top:0; z-index:20; background:rgba(255,253,248,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
    .bar, .nav, main, footer .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    .bar { display:flex; align-items:center; gap:12px; min-height:64px; }
    .logo { font-family: Fraunces, serif; font-size: 1.45rem; text-decoration:none; }
    .logo span { color: var(--gold); }
    form { margin-left:auto; display:flex; gap:6px; }
    input, textarea { font: inherit; border:1px solid var(--line); border-radius:999px; padding:8px 12px; background:#fff; }
    button, .chip { font: inherit; cursor:pointer; border:0; background:transparent; }
    .go { background:var(--forest); color:var(--paper); border-radius:999px; padding:8px 14px; }
    nav { display:flex; gap:6px; overflow:auto; padding-bottom:10px; }
    nav button { white-space:nowrap; border-radius:999px; padding:6px 12px; }
    nav button.on { background:var(--forest); color:var(--paper); }
    main { padding: 22px 16px 48px; }
    .kicker { letter-spacing:.16em; text-transform:uppercase; font-size:11px; font-weight:700; color:var(--moss); }
    .note { color:var(--muted); font-size:.92rem; }
    .grid { display:grid; gap:14px; }
    @media (min-width:760px) { .grid.two { grid-template-columns: 1fr 1fr; } }
    article.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
    article.card h2, article.card h3 { font-family: Fraunces, serif; margin:6px 0; line-height:1.2; }
    article.card a.title { text-decoration:none; }
    article.card img.foto { width:100%; height:190px; object-fit:cover; border-radius:12px; display:block; margin-bottom:10px; background:#e7e1d4; }
    article.lead img.foto { height:340px; }
    .prose img.foto { width:100%; max-height:420px; object-fit:cover; border-radius:12px; margin-bottom:12px; }
    .ad { margin:16px 0; min-height:84px; border:1px dashed #c9bfa8; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#7a7366; letter-spacing:.08em; font-size:12px; text-transform:uppercase; background:repeating-linear-gradient(-45deg,#fbf8f1,#fbf8f1 8px,#f3eee3 8px,#f3eee3 16px); }
    .rail { margin-top:22px; }
    .rail h2 { font-family: Fraunces, serif; }
    footer { background:var(--forest); color:var(--paper); }
    footer a { color:#f4efe4; }
    footer .wrap { display:grid; gap:14px; padding:28px 16px; }
    @media (min-width:760px) { footer .wrap { grid-template-columns: 1.4fr 1fr 1fr; } }
    .prose { max-width: 720px; }
    .prose h1 { font-family: Fraunces, serif; }
    #bot { position:fixed; right:16px; bottom:16px; z-index:30; width:min(100% - 32px, 340px); }
    #panel { display:none; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:8px; height:380px; flex-direction:column; }
    #panel.open { display:flex; }
    #panel header { position:static; background:var(--forest); color:var(--paper); padding:10px 12px; display:flex; justify-content:space-between; }
    #log { flex:1; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
    .msg { border-radius:14px; padding:8px 10px; font-size:.92rem; }
    .botmsg { background:var(--paper); }
    .usermsg { background:var(--forest); color:var(--paper); margin-left:28px; }
    .topics { display:flex; flex-wrap:wrap; gap:6px; padding:0 10px 8px; }
    .topics button { border:1px solid var(--line); border-radius:999px; padding:4px 8px; font-size:12px; }
    #ask { display:flex; gap:6px; padding:8px; border-top:1px solid var(--line); }
    #ask input { flex:1; }
    #openbot { background:var(--gold); color:var(--ink); border-radius:999px; padding:10px 14px; font-weight:700; float:right; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="logo" href="#/">Já Deu <span>Certo</span></a>
      <form id="search">
        <input id="q" placeholder="Buscar manchete" aria-label="Buscar" />
        <button class="go" type="submit">Buscar</button>
      </form>
    </div>
    <div class="nav" id="nav"></div>
  </header>
  <main id="app"><p class="note">Carregando manchetes…</p></main>
  <footer>
    <div class="wrap">
      <div><strong>Já Deu Certo</strong><p>Manchetes da Paraíba, do Brasil e do mundo. O texto completo fica no veículo de origem.</p></div>
      <div><a href="#/sobre">Sobre</a><br /><a href="#/contato">Contato</a><br /><a href="#/privacidade">Privacidade</a><br /><a href="#/termos">Termos</a></div>
      <div><a href="#/estados">Estados</a><br /><a href="#/automacao">Automação</a><br />redacao@jadeucerto.com</div>
    </div>
  </footer>
  <div id="bot">
    <div id="panel">
      <header><strong>Apoio do portal</strong><button id="closebot" type="button">Fechar</button></header>
      <div id="log"></div>
      <div class="topics" id="topics"></div>
      <form id="ask"><input id="askq" placeholder="Escreva o assunto" /><button class="go" type="submit">Enviar</button></form>
    </div>
    <button id="openbot" type="button">Apoio</button>
  </div>
  <script>
    const FEEDS = [
      { url: "https://www.jornaldaparaiba.com.br/feed", source: "Jornal da Paraíba", region: "paraiba" },
      { url: "https://paraibaonline.com.br/feed/", source: "Paraíba Online", region: "paraiba" },
      { url: "https://portalcorreio.com.br/feed/", source: "Portal Correio", region: "paraiba" },
      { url: "https://g1.globo.com/dynamo/pb/paraiba/rss2.xml", source: "g1 Paraíba", region: "paraiba" },
      { url: "https://g1.globo.com/rss/g1/", source: "g1", region: "brasil" },
      { url: "https://rss.uol.com.br/feed/noticias.xml", source: "UOL", region: "brasil" },
      { url: "https://www.cnnbrasil.com.br/feed/", source: "CNN Brasil", region: "brasil" },
      { url: "https://agenciabrasil.ebc.com.br/rss/politica/feed.xml", source: "Agência Brasil", region: "brasil", section: "politica" },
      { url: "https://agenciabrasil.ebc.com.br/rss/economia/feed.xml", source: "Agência Brasil", region: "brasil", section: "economia" },
      { url: "https://g1.globo.com/dynamo/pop-arte/rss2.xml", source: "g1 Pop & Arte", region: "brasil", section: "entretenimento" },
      { url: "https://rss.uol.com.br/feed/entretenimento.xml", source: "UOL Entretenimento", region: "brasil", section: "entretenimento" },
      { url: "https://feeds.bbci.co.uk/portuguese/rss.xml", source: "BBC News Brasil", region: "mundo" }
    ];
    const NAV = [
      ["Capa", "#/"], ["Paraíba", "#/secao/paraiba"], ["Estados", "#/estados"], ["Brasil", "#/secao/brasil"], ["Mundo", "#/secao/mundo"],
      ["Política", "#/secao/politica"], ["Economia", "#/secao/economia"], ["Esportes", "#/secao/esportes"], ["Famosos", "#/secao/entretenimento"], ["Cultura", "#/secao/cultura"]
    ];
    const ESTADOS = [
      ["AC","Acre","Rio Branco"],["AL","Alagoas","Maceió"],["AP","Amapá","Macapá"],["AM","Amazonas","Manaus"],
      ["BA","Bahia","Salvador"],["CE","Ceará","Fortaleza"],["DF","Distrito Federal","Brasília"],["ES","Espírito Santo","Vitória"],
      ["GO","Goiás","Goiânia"],["MA","Maranhão","São Luís"],["MT","Mato Grosso","Cuiabá"],["MS","Mato Grosso do Sul","Campo Grande"],
      ["MG","Minas Gerais","Belo Horizonte"],["PA","Pará","Belém"],["PB","Paraíba","João Pessoa"],["PR","Paraná","Curitiba"],
      ["PE","Pernambuco","Recife"],["PI","Piauí","Teresina"],["RJ","Rio de Janeiro","Rio de Janeiro"],["RN","Rio Grande do Norte","Natal"],
      ["RS","Rio Grande do Sul","Porto Alegre"],["RO","Rondônia","Porto Velho"],["RR","Roraima","Boa Vista"],["SC","Santa Catarina","Florianópolis"],
      ["SP","São Paulo","São Paulo"],["SE","Sergipe","Aracaju"],["TO","Tocantins","Palmas"]
    ];
    const RULES = [
      ["esportes", /futebol|campeonato|treze|botafogo|esporte|olimp|basquete|vôlei|volei|nba|libertadores|brasileir[aã]o/i],
      ["economia", /economia|d[oó]lar|infla|emprego|sal[aá]rio|pib|imposto|mercado|safra|juros|bolsa|selic/i],
      ["politica", /pol[ií]tica|prefeit|govern|c[aâ]mara|deputad|elei[cç]|assembleia|stf|senado|ministro/i],
      ["entretenimento", /famos|celebr|novela|ator|atriz|cantor|cantora|bbb|casamento|separa[cç]|hollywood|oscar|influencer/i],
      ["cultura", /cultura|show|m[uú]sica|festival|cinema|forr[oó]|s[aã]o jo[aã]o|teatro|livro|arte/i]
    ];
    const TOPICS = {
      "Paraíba": "A editoria Paraíba reúne jornais locais e o g1 Paraíba.",
      "Estados": "O menu Estados abre os 27 estados e busca as últimas manchetes no Google Notícias.",
      "Famosos": "Famosos vem do g1 Pop e Arte e do UOL Entretenimento.",
      "Anúncios": "Os espaços dizem PUBLICIDADE. Não há aposta nem cassino.",
      "Automação": "A busca chama o Apps Script, que consulta o Google Notícias e grava na planilha.",
      "Contato": "Escreva para redacao@jadeucerto.com.",
      "Privacidade": "O site usa o Google Analytics informado no código. Detalhes estão em Privacidade."
    };
    let items = [];
    let note = "Buscando os feeds públicos…";
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGZautsGqg3XpACUFGbGSngu-7qoNxEcs5CkWpq5H6RGoLUsLLP79ia1rSUGyI8jeE/exec";
    function sectionOf(title, region) {
      const hit = RULES.find((r) => r[1].test(title));
      return hit ? hit[0] : region;
    }
    function slug(url) {
      return btoa(unescape(encodeURIComponent(url))).replace(/[^a-z0-9]/gi, "").slice(0, 24);
    }
    function esc(s) {
      return String(s || "").replace(/[&<>"]/g, function (c) {
        if (c === "&") return "&" + "amp;";
        if (c === "<") return "&" + "lt;";
        if (c === ">") return "&" + "gt;";
        return "&" + "quot;";
      });
    }
    function when(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "" : d.toLocaleString("pt-BR", { timeZone: "America/Fortaleza" });
    }
    function imagemDoItem(item) {
      if (item.thumbnail) return item.thumbnail;
      var enc = item.enclosure || {};
      if (enc.link) return enc.link;
      var html = String(item.content || "") + String(item.description || "");
      var m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
      return m ? m[1] : "";
    }
    async function load() {
      const batches = await Promise.all(FEEDS.map(async (feed) => {
        try {
          const res = await fetch("https://api.rss2json.com/v1/api.json?count=8&rss_url=" + encodeURIComponent(feed.url));
          const data = await res.json();
          if (data.status !== "ok") return [];
          return (data.items || []).map((item) => ({
            title: item.title,
            excerpt: String(item.description || item.content || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 220),
            image: imagemDoItem(item),
            url: item.link,
            source: feed.source,
            region: feed.region,
            section: feed.section || sectionOf(item.title + " " + (item.content || item.description || ""), feed.region),
            publishedAt: item.pubDate,
            slug: slug(item.link)
          }));
        } catch (e) { return []; }
      }));
      const seen = new Set();
      items = batches.flat().filter((item) => item.url && !seen.has(item.url) && seen.add(item.url));
      items.sort((a, b) => +new Date(b.publishedAt) - +new Date(a.publishedAt));
      note = items.length
        ? "Manchetes lidas agora dos feeds públicos. Última abertura: " + new Date().toLocaleString("pt-BR", { timeZone: "America/Fortaleza" }) + ". O texto completo fica na fonte."
        : "Os feeds não responderam nesta abertura. Recarregue a página em alguns minutos.";
      render();
    }
    function card(item, featured) {
      var foto = item.image ? '<img class="foto" src="' + esc(item.image) + '" alt="" />' : "";
      var tag = featured ? "h2" : "h3";
      return '<article class="card' + (featured ? " lead" : "") + '">' + foto + '<p class="kicker">' + esc(item.source) + " · " + esc(item.section) + "</p><" + tag + '><a class="title" href="#/noticia/' + item.slug + '">' + esc(item.title) + "</a></" + tag + "><p>" + esc(item.excerpt) + '</p><p class="note">' + esc(when(item.publishedAt)) + "</p></article>";
    }
    function ad() { return '<div class="ad">Publicidade</div>'; }
    function list(title, rows) {
      if (!rows.length) return "";
      return '<section class="rail"><h2>' + esc(title) + '</h2><div class="grid two">' + rows.slice(0, 4).map(function (item) { return card(item, false); }).join("") + "</div></section>";
    }
    function page(html) { document.getElementById("app").innerHTML = html; }
    function home() {
      var lead = items[0];
      var rest = items.slice(1);
      page('<p class="note">' + esc(note) + '</p><div id="alta"></div>' + (lead ? card(lead, true) : "") + ad() + '<div class="grid two">' + rest.slice(0, 4).map(function (item) { return card(item, false); }).join("") + "</div>" + list("Paraíba", items.filter(function (i) { return i.region === "paraiba"; })) + list("Brasil", items.filter(function (i) { return i.region === "brasil"; })) + list("Mundo", items.filter(function (i) { return i.region === "mundo"; })) + list("Famosos", items.filter(function (i) { return i.section === "entretenimento"; })));
      emAlta();
    }
    async function emAlta() {
      if (!document.getElementById("alta")) return;
      var termos = [];
      try {
        const res = await fetch(SCRIPT_URL + "?acao=tendencias");
        const data = await res.json();
        termos = (data.tendencias || []).map(function (t) { return t.termo; }).filter(Boolean);
      } catch (e) {}
      if (!termos.length || !document.getElementById("alta")) return;
      document.getElementById("alta").innerHTML = '<p class="kicker">Em alta no Google</p><div class="topics">' + termos.slice(0, 8).map(function (t) { return '<button type="button" data-trend="' + esc(t) + '">' + esc(t) + "</button>"; }).join("") + "</div>";
      document.getElementById("alta").onclick = function (e) {
        var termo = e.target.getAttribute && e.target.getAttribute("data-trend");
        if (termo) location.hash = "#/busca/" + encodeURIComponent(termo);
      };
    }
    function menciona(texto, termo) {
      var n = String(texto || "").toLowerCase();
      var q = String(termo || "").toLowerCase();
      if (!q) return false;
      var i = 0;
      while ((i = n.indexOf(q, i)) !== -1) {
        var antes = i === 0 || !/[a-záàâãéêíóôõúç]/.test(n[i - 1]);
        var depois = i + q.length >= n.length || !/[a-záàâãéêíóôõúç]/.test(n[i + q.length]);
        if (antes && depois) return true;
        i += q.length;
      }
      return false;
    }
    function doEstado(uf) {
      var row = ESTADOS.find(function (e) { return e[0] === String(uf || "").toUpperCase(); });
      if (!row) return [];
      return items.filter(function (it) { return menciona(it.title + " " + it.excerpt, row[1]) || menciona(it.title + " " + it.excerpt, row[2]); });
    }
    function estados() {
      var cards = ESTADOS.map(function (e) {
        return '<a class="card" style="text-decoration:none" href="#/estado/' + e[0].toLowerCase() + '"><p class="kicker">' + e[0] + "</p><h3>" + esc(e[1]) + '</h3><p class="note">Capital ' + esc(e[2]) + " · " + doEstado(e[0]).length + " manchetes agora</p></a>";
      }).join("");
      page('<p class="kicker">Brasil</p><h1 style="font-family:Fraunces,serif">Estados</h1><p>Cada estado busca as últimas manchetes no Google Notícias. Digite uma cidade para procurar só nela.</p><form id="cidade" style="margin:12px 0"><input id="cidadeq" placeholder="Nome da cidade" aria-label="Cidade" /><button class="go" type="submit">Ver cidade</button></form><div class="grid two">' + cards + "</div>");
      document.getElementById("cidade").addEventListener("submit", function (e) {
        e.preventDefault();
        var q = document.getElementById("cidadeq").value.trim();
        if (q) location.hash = "#/cidade/" + encodeURIComponent(q);
      });
    }
    function normalizarRemoto(item) {
      var title = item.titulo || item.title || "";
      var fonte = item.fonte || item.source || "Google Notícias";
      if (!item.fonte && title.indexOf(" - ") > 0) {
        var partes = title.split(" - ");
        fonte = partes.pop();
        title = partes.join(" - ");
      }
      var url = item.url || item.link || "";
      return { title: title, excerpt: item.resumo || item.excerpt || "", image: item.imagem || item.image || "", url: url, source: fonte, region: item.regiao || "brasil", section: item.editoria || item.section || "brasil", publishedAt: item.publicado_em || item.publishedAt || item.pubDate || "", slug: slug(url || title) };
    }
    async function buscarNaRede(q) {
      try {
        const res = await fetch(SCRIPT_URL + "?q=" + encodeURIComponent(q));
        const data = await res.json();
        if (data.items && data.items.length) return data.items.map(normalizarRemoto);
      } catch (e) {}
      try {
        var rss = "https://news.google.com/rss/search?q=" + encodeURIComponent(q) + "&hl=pt-BR&gl=BR&ceid=BR:pt-419";
        const res2 = await fetch("https://api.rss2json.com/v1/api.json?count=12&rss_url=" + encodeURIComponent(rss));
        const data2 = await res2.json();
        if (data2.status !== "ok") return [];
        return (data2.items || []).map(normalizarRemoto);
      } catch (e) { return []; }
    }
    function juntar(listas) {
      var seen = new Set();
      return listas.flat().filter(function (item) { return item.url && !seen.has(item.url) && seen.add(item.url); });
    }
    async function paginaEstado(uf) {
      var row = ESTADOS.find(function (e) { return e[0] === String(uf || "").toUpperCase(); });
      if (!row) return page('<p>Estado não encontrado. Volte para <a href="#/estados">Estados</a>.</p>');
      page('<p class="kicker">' + row[0] + '</p><h1 style="font-family:Fraunces,serif">' + esc(row[1]) + '</h1><p class="note">Buscando as últimas manchetes…</p>');
      var rows = juntar([doEstado(row[0]), await buscarNaRede(row[1])]);
      page('<p class="kicker">' + row[0] + '</p><h1 style="font-family:Fraunces,serif">' + esc(row[1]) + "</h1><p>" + esc(row[1]) + ", capital " + esc(row[2]) + '. Busca ao vivo no script e no Google Notícias. O texto completo fica na fonte.</p><p class="note">' + rows.length + " manchetes.</p>" + ad() + '<div class="grid two">' + (rows.map(function (item) { return card(item, false); }).join("") || "<p>Nenhuma manchete deste estado agora.</p>") + "</div>");
    }
    async function paginaCidade(nome) {
      page('<p class="kicker">Cidade</p><h1 style="font-family:Fraunces,serif">' + esc(nome) + '</h1><p class="note">Buscando as últimas manchetes…</p>');
      var locais = items.filter(function (it) { return menciona(it.title + " " + it.excerpt, nome); });
      var rows = juntar([locais, await buscarNaRede(nome)]);
      page('<p class="kicker">Cidade</p><h1 style="font-family:Fraunces,serif">' + esc(nome) + '</h1><p>Busca ao vivo. Se algum veículo publicou sobre esta cidade, a manchete entra aqui com o link da fonte.</p><p class="note">' + rows.length + ' manchetes.</p><div class="grid two">' + (rows.map(function (item) { return card(item, false); }).join("") || "<p>Nenhuma manchete citou essa cidade agora.</p>") + "</div>");
    }
    function secao(name) {
      var rows = items.filter(function (i) { return i.section === name || i.region === name; });
      var titulo = name === "entretenimento" ? "Famosos" : name;
      page('<p class="kicker">Editoria</p><h1 style="font-family:Fraunces,serif">' + esc(titulo) + '</h1><p class="note">' + rows.length + " manchetes nesta abertura.</p>" + ad() + '<div class="grid two">' + (rows.map(function (item) { return card(item, false); }).join("") || "<p>Nada nesta editoria agora.</p>") + "</div>");
    }
    function noticia(id) {
      var item = items.find(function (i) { return i.slug === id; });
      if (!item) return page('<p>Manchete não encontrada. Volte para a <a href="#/">capa</a>.</p>');
      var foto = item.image ? '<img class="foto" src="' + esc(item.image) + '" alt="" />' : "";
      page('<article class="prose">' + foto + '<p class="kicker">' + esc(item.source) + " · " + esc(item.section) + '</p><h1>' + esc(item.title) + '</h1><p class="note">' + esc(when(item.publishedAt)) + "</p><p>" + esc(item.excerpt) + "</p>" + ad() + '<p>Este portal mostra o título e um trecho curto. O texto completo pertence à fonte.</p><p><a class="go" style="display:inline-block;text-decoration:none" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">Ler na fonte</a></p></article>');
    }
    async function busca(q) {
      page('<h1 style="font-family:Fraunces,serif">Busca: ' + esc(q) + '</h1><p class="note">Consultando o Apps Script e o Google Notícias…</p>');
      var n = q.toLowerCase();
      var locais = items.filter(function (i) { return (i.title + " " + i.excerpt + " " + i.source).toLowerCase().indexOf(n) !== -1; });
      var rows = juntar([locais, await buscarNaRede(q)]);
      page('<h1 style="font-family:Fraunces,serif">Busca: ' + esc(q) + '</h1><p class="note">' + rows.length + ' manchetes, incluindo as últimas encontradas agora.</p><div class="grid two">' + (rows.map(function (item) { return card(item, false); }).join("") || "<p>Nenhuma manchete com esse termo agora.</p>") + "</div>");
    }
    const STATIC = {
      sobre: '<article class="prose"><h1>Sobre</h1><p>O Já Deu Certo publica título, trecho e link da fonte. Não reescrevemos a reportagem.</p><p>Fontes: Jornal da Paraíba, Paraíba Online, Portal Correio, g1, UOL, CNN Brasil, Agência Brasil e BBC News Brasil. A busca também consulta o Google Notícias pelo Apps Script.</p><p>Contato: redacao@jadeucerto.com.</p></article>',
      contato: '<article class="prose"><h1>Contato</h1><p>E-mail da redação: <a href="mailto:redacao@jadeucerto.com">redacao@jadeucerto.com</a>.</p></article>',
      privacidade: '<article class="prose"><h1>Privacidade</h1><p>Este site usa o Google Analytics (G-1V0JM8J72L). Quando o AdSense da conta ca-pub-5066020163837493 for ativado, o Google pode usar cookies de anúncio.</p><p>Não pedimos cadastro e não vendemos lista de leitores.</p></article>',
      termos: '<article class="prose"><h1>Termos</h1><p>O título e o trecho identificam a notícia e apontam a fonte. O texto integral pertence ao veículo original.</p><p>O site não oferece aposta, cassino nem conteúdo adulto.</p></article>',
      automacao: '<article class="prose"><h1>Automação</h1><p>A busca, os estados e as cidades chamam o Apps Script publicado. A função coletar, a cada 15 minutos, grava portais, assuntos em alta e notícias dos 27 estados.</p></article>'
    };
    function render() {
      var hash = location.hash || "#/";
      var part = hash.replace(/^#\/?/, "");
      var bits = part.split("/");
      var name = bits[0];
      var arg = bits[1];
      document.getElementById("nav").innerHTML = NAV.map(function (item) {
        var on = item[1] === "#/" ? (hash === "#/" || hash === "") : hash.indexOf(item[1]) === 0;
        return '<button class="' + (on ? "on" : "") + '" type="button" data-href="' + item[1] + '">' + item[0] + "</button>";
      }).join("");
      if (!name) return home();
      if (name === "estados") return estados();
      if (name === "estado" && arg) return paginaEstado(arg);
      if (name === "cidade" && arg) return paginaCidade(decodeURIComponent(arg));
      if (name === "secao" && arg) return secao(decodeURIComponent(arg));
      if (name === "noticia" && arg) return noticia(arg);
      if (name === "busca") return busca(decodeURIComponent(arg || ""));
      if (STATIC[name]) return page(STATIC[name]);
      home();
    }
    document.getElementById("nav").addEventListener("click", function (e) {
      var href = e.target.getAttribute && e.target.getAttribute("data-href");
      if (href) location.hash = href;
    });
    document.getElementById("search").addEventListener("submit", function (e) {
      e.preventDefault();
      location.hash = "#/busca/" + encodeURIComponent(document.getElementById("q").value.trim());
    });
    window.addEventListener("hashchange", render);
    var log = document.getElementById("log");
    function say(from, text) {
      var p = document.createElement("p");
      p.className = "msg " + (from === "bot" ? "botmsg" : "usermsg");
      p.textContent = text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }
    function answer(text) {
      say("user", text);
      var key = Object.keys(TOPICS).find(function (k) { return text.toLowerCase().indexOf(k.toLowerCase()) !== -1; });
      say("bot", key ? TOPICS[key] : "Posso falar sobre Paraíba, Estados, Famosos, anúncios, automação, contato e privacidade.");
    }
    say("bot", "Olá. Sou o apoio do Já Deu Certo. Escolha um assunto ou escreva a palavra.");
    document.getElementById("topics").innerHTML = Object.keys(TOPICS).map(function (k) { return '<button type="button">' + k + "</button>"; }).join("");
    document.getElementById("topics").addEventListener("click", function (e) { if (e.target.tagName === "BUTTON") answer(e.target.textContent); });
    document.getElementById("ask").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("askq").value.trim();
      if (!v) return;
      document.getElementById("askq").value = "";
      answer(v);
    });
    document.getElementById("openbot").onclick = function () { document.getElementById("panel").classList.add("open"); };
    document.getElementById("closebot").onclick = function () { document.getElementById("panel").classList.remove("open"); };
    render();
    load();
  </script>
</body>
</html>
